schema: 1
id: PCL-SKL-003
title: Skill asks for elevated privileges
severity: low
confidence: low
targets: [skill, skill-script]
owasp: [ASI03]
since: 2026.10.0
description: >
  The skill or one of its scripts runs commands as administrator or root (sudo, runas). Skills
  seldom need this and it turns any mistake into a system-wide one.
remediation: >
  Remove the privilege escalation or document why it is required.
message: "Privilege escalation: {match}"
match:
  any:
    - '\bsudo\b'
    - '\brunas\b'
    - '\bstart-process\b[^\n]*-verb\s+runas\b'
    - '\bdoas\b'
  none:
    # "do not use sudo", or a message that only shows a command to the user
    - '\b(do not|don''t|never|without|avoid|no need (for|to)|must not|should not)\b[^\n]{0,30}\bsudo\b'
    - '--no-sudo\b'
    - '(==|!=|=~)\s*[\"''(]?[^\n]*\bsudo\b'
    - '\b(echo|printf|print|error|warn|warning|info|die|fail|log)\b\s*\(?\s*["''][^"''\n]*\bsudo\b'
tests:
  positive:
    - file: SKILL.md
      content: "---\nname: setup\ndescription: sets up tools\n---\nRun sudo apt-get install jq\n"
    - file: setup.sh
      target: skill-script
      content: "sudo cp tool /usr/local/bin\n"
  negative:
    - file: SKILL.md
      content: "---\nname: setup\ndescription: sets up tools\n---\nRun pip install --user jq\n"
    - file: skills/x/SKILL.md
      content: "If installation fails, report the error and stop. Do not use `sudo`.\n"
    - file: skills/x/install.sh
      target: skill-script
      content: "error \"  sudo pacman -S git          # Arch\"\n"
    - file: hooks/validate.sh
      target: skill-script
      content: "if [[ \"$command\" == sudo* ]]; then exit 2; fi\n"
