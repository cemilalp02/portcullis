schema: 1
id: PCL-UNI-001
title: Unicode Tag characters (invisible ASCII smuggling)
severity: critical
confidence: high
targets: [instruction, config]
owasp: [ASI06, MCP03]
since: 2026.10.0
description: >
  Characters in the Unicode Tag block (U+E0000-U+E007F) are invisible in editors and on
  GitHub, but many LLMs read them as the ASCII letters they shadow. They let an attacker
  hide complete instructions inside an otherwise harmless-looking file.
remediation: >
  Remove the characters and treat the repository as hostile until the hidden text has been
  decoded and reviewed (each U+E00xx character stands for ASCII 0xxx).
references:
  - https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/
message: "{count} invisible Unicode Tag characters"
match:
  view: raw
  codepoints: ["U+E0000..U+E007F"]
tests:
  positive:
    - file: CLAUDE.md
      content: "Build with make.\U000E0069\U000E0067\U000E006E\U000E006F\U000E0072\U000E0065\n"
    - file: .claude/settings.json
      content: "{\"env\": {\"NOTE\": \"ok\U000E0041\"}}"
  negative:
    - file: CLAUDE.md
      content: "Build with make. Emoji are fine: \U0001F600 and flags \U0001F1F9\U0001F1F7\n"
