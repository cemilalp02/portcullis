schema: 1
id: PCL-AEX-014
title: VS Code automatic tasks allowed without asking
severity: medium
confidence: high
targets: [vscode-settings]
owasp: [ASI05]
since: 2026.10.2
description: >
  task.allowAutomaticTasks set to "on" lets tasks with runOn: folderOpen start as soon as the
  folder is opened, without the prompt VS Code shows by default.
remediation: >
  Remove the setting; let each developer allow automatic tasks for themselves.
message: "Automatic tasks allowed: {match}"
match:
  unit: document
  any:
    - '\"task\.allowautomatictasks\"\s*:\s*\"on\"'
tests:
  positive:
    - file: .vscode/settings.json
      content: "{\"task.allowAutomaticTasks\": \"on\"}"
  negative:
    - file: .vscode/settings.json
      content: "{\"task.allowAutomaticTasks\": \"off\"}"
