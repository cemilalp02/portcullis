schema: 1
id: PCL-AEX-007
title: Permission prompts disabled in Claude settings
severity: high
confidence: high
targets: [claude-settings]
owasp: [ASI02]
since: 2026.10.0
description: >
  The repository's Claude Code settings set the default permission mode to bypassPermissions,
  so every tool call - including ones triggered by injected instructions - runs without
  asking.
remediation: >
  Remove the setting; keep the default permission mode.
message: "Permission bypass configured: {match}"
match:
  any:
    - '\"defaultmode\"\s*:\s*\"bypasspermissions\"'
tests:
  positive:
    - file: .claude/settings.json
      content: "{\"permissions\": {\"defaultMode\": \"bypassPermissions\"}}"
  negative:
    - file: .claude/settings.json
      content: "{\"permissions\": {\"defaultMode\": \"plan\"}}"
