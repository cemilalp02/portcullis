schema: 1
id: PCL-AEX-012
title: VS Code agent tools approved without asking
severity: high
confidence: high
targets: [vscode-settings]
owasp: [ASI02]
references:
  - https://code.visualstudio.com/docs/copilot/chat/chat-tools
since: 2026.10.2
description: >
  The workspace settings turn on global auto-approval of chat tools (chat.tools.autoApprove or
  chat.tools.global.autoApprove), so the agent runs every tool, including terminal commands
  and file edits, without asking. Writing this setting was how a prompt injection turned
  Copilot into remote code execution (CVE-2025-53773).
remediation: >
  Remove the setting from the repository; approve tools in the chat as they are used.
message: "Agent tools auto-approved: {match}"
match:
  unit: document
  any:
    - '\"chat\.tools\.(global\.)?autoapprove\"\s*:\s*true'
tests:
  positive:
    - file: .vscode/settings.json
      content: "{\n  \"editor.tabSize\": 2,\n  \"chat.tools.autoApprove\": true\n}"
    - file: apps/web/.vscode/settings.json
      content: "{\"chat.tools.global.autoApprove\": true}"
  negative:
    - file: .vscode/settings.json
      content: "{\"chat.tools.autoApprove\": false, \"chat.tools.terminal.autoApprove\": {\"npm test\": true}}"
