schema: 1
id: PCL-ENG-006
title: File could not be read
severity: high
confidence: high
targets: [instruction, config, script]
owasp: [ASI04]
since: 2026.10.0
description: >
  An agent context file could not be read, so it was not analysed. The scan result is
  incomplete and Portcullis exits with code 2.
remediation: >
  Fix the file permissions or remove the file, then scan again.
message: "File could not be read: {name}"
match:
  builtin: engine
