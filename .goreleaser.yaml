# Release builds for Portcullis (docs/RELEASING.md). The release workflow
# (.github/workflows/release.yml) runs this on a version tag, signs the
# checksums with Sigstore and attests SLSA build provenance for every file.
# Try it locally without publishing or signing:
#
#   goreleaser release --snapshot --clean --skip=sign
version: 2

project_name: portcullis

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: portcullis
    main: ./cmd/portcullis
    binary: portcullis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/cemilalp02/portcullis/internal/version.version={{ .Tag }}
      - -X github.com/cemilalp02/portcullis/internal/version.commit={{ .FullCommit }}
      - -X github.com/cemilalp02/portcullis/internal/version.date={{ .CommitDate }}
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: portcullis
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX software bill of materials per archive, made by syft.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# Keyless Sigstore signature of checksums.txt; it covers every archive and
# SBOM by digest. The bundle holds the signature, certificate and the
# transparency-log entry.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# The release notes come from CHANGELOG.md (scripts/release/notes.sh).
changelog:
  disable: true

release:
  github:
    owner: cemilalp02
    name: portcullis
  # Published by the workflow once the provenance attestation exists.
  draft: true
  prerelease: auto
  footer: |
    ## Verify the download

    Every file has SLSA build provenance from the release workflow, and `checksums.txt` is
    signed with Sigstore. With the [GitHub CLI](https://cli.github.com):

    ```bash
    gh attestation verify portcullis_{{ .Version }}_linux_amd64.tar.gz --repo cemilalp02/portcullis
    ```

    Or with [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) and the checksums:

    ```bash
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/cemilalp02/portcullis/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```
