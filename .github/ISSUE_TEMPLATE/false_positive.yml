name: False positive
description: Bekçi flagged legitimate content.
labels: [false-positive, rules, triage]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: BEK-EXE-001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bekçi version
      description: Output of `bekci version`
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Public repository / file (if any)
      placeholder: https://github.com/owner/repo/blob/<sha>/CLAUDE.md
  - type: textarea
    id: content
    attributes:
      label: Minimal content that triggers the finding
      description: The smallest snippet that still reproduces it.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this legitimate?
    validations:
      required: true
