name: Bug report
description: Portcullis crashed, errored or behaved differently from the documentation.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        If the bug could let malicious content bypass or control Portcullis, **stop** and report it
        privately instead: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Portcullis version
      description: Output of `portcullis version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (including exit code and output)
    validations:
      required: true
