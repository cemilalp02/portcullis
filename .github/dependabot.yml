version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web/report
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      report-ui:
        patterns: ["*"]
